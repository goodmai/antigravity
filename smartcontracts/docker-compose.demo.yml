# Daskibo Academy — DEMO stack (local Anvil, MetaMask-driven, no real funds)
#
# A fully local, self-contained demo of the course-sale flow. Everything runs
# on one Anvil chain; you drive it from the browser with MetaMask, switching
# accounts to play each role:
#
#   anvil          Local EVM chain 31337 on :8545 (pre-funds 10 dev accounts
#                  with 10000 ETH each). Published so host MetaMask can reach it.
#
#   demo-deploy    Foundry one-shot. Deploys Treasury + AccessPass +
#                  CourseMarketplace (wired), seeds ONE sample course as the
#                  Author (anvil #1) so there's a template to view immediately,
#                  and writes ./demo/addresses.json for the frontend. Exits.
#
#   chipotle-mock  Local DRM key server (:8000). Releases a lesson's decryption
#                  key ONLY when the caller satisfies the on-chain ACC
#                  (CourseMarketplace.hasCourseAccess) — checked against anvil.
#
#   demo-encrypt   One-shot. AES-encrypts the seeded lesson and wraps its key
#                  behind the ACC → ./demo/manifest-1.json. Exits.
#
#   frontend       nginx serving course-demo.html on :8099 (LONG-RUNNING).
#                  Connect MetaMask → register a course (Author), buy it
#                  (Client), watch Eve get denied, and read the access matrix.
#                  The "Open course" link opens course-content.html, a GATED
#                  reader: it verifies hasCourseAccess + asks Chipotle to release
#                  the key, then decrypts the lesson client-side.
#
# No native funds or external config needed — it's a throwaway local chain.
# The three personas use the standard PUBLIC Anvil keys (see ../.env DEMO_*),
# importable into MetaMask. Open: http://localhost:8099/course-demo.html
#
# Run:
#   ../run_demo.sh                                   # recommended (waits + prints URL)
#   docker compose -f docker-compose.demo.yml up --build -d
#   docker compose -f docker-compose.demo.yml down -v               # stop + wipe

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: daskibo-demo-anvil
    entrypoint: ["sh", "-c"]
    command:
      - anvil --host 0.0.0.0 --port 8545 --chain-id 31337
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 5s
      retries: 20

  demo-deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: daskibo-demo-deploy
    user: root
    working_dir: /work
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      # anvil #0 deploys; anvil #1 (Author) seeds the sample course. Public test keys.
      - DEPLOYER_PK=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - AUTHOR_PK=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      - RPC_URL=http://anvil:8545
    volumes:
      - ./contracts:/work
      # Bind to the served source tree so nginx exposes it at /demo/addresses.json
      # via its own root mount — no nested mountpoint inside the read-only mount.
      - ./demo:/shared
    # Literal (|) block: a normal shell script, one statement per line. (A
    # folded `>` scalar silently turns more-indented continuation lines into
    # command-splitting newlines — fatal for multi-line cast/forge invocations.)
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
        test -d lib/openzeppelin-contracts || forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.6.1
        forge build
        echo "→ Deploying Treasury / AccessPass / CourseMarketplace to local anvil…"
        OUT=$$(PRIVATE_KEY=$$DEPLOYER_PK forge script script/Deploy.s.sol:Deploy --rpc-url "$$RPC_URL" --broadcast -vvv 2>&1)
        echo "$$OUT"
        TREASURY=$$(printf '%s' "$$OUT" | grep -i 'Treasury ' | grep -oiE '0x[0-9a-f]{40}' | tail -1)
        ACCESSPASS=$$(printf '%s' "$$OUT" | grep -i 'AccessPass ' | grep -oiE '0x[0-9a-f]{40}' | tail -1)
        MARKETPLACE=$$(printf '%s' "$$OUT" | grep -i 'CourseMarketplace' | grep -oiE '0x[0-9a-f]{40}' | tail -1)
        if [ -z "$$MARKETPLACE" ] || [ -z "$$ACCESSPASS" ]; then echo "ERROR: could not parse deployed addresses"; exit 1; fi
        echo "→ Seeding one sample course as the Author (anvil #1)…"
        HASH=$$(cast keccak "Intro to Greenfield|daskibo-demo-101")
        cast send --rpc-url "$$RPC_URL" --private-key "$$AUTHOR_PK" "$$MARKETPLACE" "registerCourse(uint96,bytes32,string,uint64)" 10000000000000000 "$$HASH" "daskibo-demo-101" 0
        mkdir -p /shared
        printf '{\n  "chainId": 31337,\n  "chainIdHex": "0x7a69",\n  "chainName": "Daskibo Anvil (local)",\n  "rpcUrl": "http://127.0.0.1:8545",\n  "treasury": "%s",\n  "accessPass": "%s",\n  "marketplace": "%s"\n}\n' "$$TREASURY" "$$ACCESSPASS" "$$MARKETPLACE" > /shared/addresses.json
        echo "═══════════════════════════════════════════════════════════"
        echo "DEMO CONTRACTS DEPLOYED (local anvil, chain 31337)"
        cat /shared/addresses.json
        echo "═══════════════════════════════════════════════════════════"

  # Local Chipotle MOCK — the DRM key server. Releases the lesson's decryption
  # key only when the requester satisfies the on-chain ACC
  # (CourseMarketplace.hasCourseAccess) — evaluated against anvil via EVM_RPC.
  chipotle-mock:
    image: node:22-bookworm
    container_name: daskibo-demo-chipotle
    working_dir: /app/smartcontracts/greenfield-testnet
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      - CHIPOTLE_PORT=8000
      - EVM_RPC=http://anvil:8545
    volumes:
      - ../:/app
    ports:
      - "8000:8000"
    command: ["sh", "-c", "npm install --no-audit --no-fund && node chipotle-mock.mjs"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/core/v1/version"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  # One-shot: AES-encrypt the seeded lesson and wrap its key behind the ACC,
  # writing ./demo/manifest-1.json for the reader page.
  demo-encrypt:
    image: node:22-bookworm
    container_name: daskibo-demo-encrypt
    working_dir: /app/smartcontracts/greenfield-testnet
    depends_on:
      demo-deploy:
        condition: service_completed_successfully
      chipotle-mock:
        condition: service_healthy
    environment:
      - SHARED_DIR=/shared
      - CHIPOTLE_URL=http://chipotle-mock:8000
      - CHIPOTLE_PUBLIC_URL=http://localhost:8000
      - DEMO_COURSE_ID=1
      - DEMO_COURSE_TITLE=Intro to Greenfield
    volumes:
      - ../:/app
      - ./demo:/shared
    command: ["sh", "-c", "npm install --no-audit --no-fund && node demo-encrypt.mjs"]

  frontend:
    image: nginx:1.27-alpine
    container_name: daskibo-demo-frontend
    depends_on:
      demo-deploy:
        condition: service_completed_successfully
      demo-encrypt:
        condition: service_completed_successfully
    ports:
      - "8099:80"
    volumes:
      # The source tree (incl. ./demo/addresses.json written by demo-deploy) is
      # served read-only; the page fetches ./demo/addresses.json from here.
      - ./:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/course-demo.html"]
      interval: 5s
      timeout: 3s
      retries: 10
