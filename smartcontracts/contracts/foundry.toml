[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# `src/` is self-contained (no OpenZeppelin) so it builds without network
# installs. Tests need forge-std:  forge install foundry-rs/forge-std
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 256
