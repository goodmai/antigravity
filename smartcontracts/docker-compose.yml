# Local frontend integration stack for the Greenfield bucket console.
#
#   frontend  — nginx serving the static smartcontracts/ site
#   mock-sp   — deterministic mock Greenfield Storage Provider gateway
#
# Brought up automatically by tests/greenfield-integration.docker.test.js
# (skipped when Docker is unavailable), or by hand:
#
#   docker compose -f smartcontracts/docker-compose.yml up -d
#   curl localhost:8080/                       # the bucket console
#   curl localhost:9000/healthz                # the mock SP
#   docker compose -f smartcontracts/docker-compose.yml down

services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/index.html"]
      interval: 3s
      timeout: 3s
      retries: 10

  mock-sp:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "mock-sp.mjs"]
    environment:
      - PORT=9000
    ports:
      - "9000:9000"
    volumes:
      - ./integration/mock-sp.mjs:/app/mock-sp.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
