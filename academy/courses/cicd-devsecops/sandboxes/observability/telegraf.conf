[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "sandbox"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
[[inputs.mem]]
[[inputs.disk]]
  ignore_fs = ["tmpfs","devtmpfs","overlay"]
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"

[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUX_TOKEN:-my-super-secret-token}"
  organization = "daskibo"
  bucket       = "metrics"
