version: "3.8"
# Sandbox: secrets — Vault dev + age для SOPS

services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    command: ["vault", "server", "-dev", "-dev-root-token-id=dev-root-token"]
    ports: ["8200:8200"]

  vault-init:
    image: hashicorp/vault:1.17
    depends_on: [vault]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until vault status; do sleep 1; done
        vault secrets enable -version=2 -path=kv kv || true
        vault kv put kv/prod/app database_url='postgres://localhost/app' jwt_key='change-me'
        echo 'sandbox secrets seeded.'

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
