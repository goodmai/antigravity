# Runs the vitest suite + strict typecheck on every push / PR.
# (Deploy is handled separately by static.yml.)
name: Test & Typecheck

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json is gitignored in this repo, so use install (not ci).
      - run: npm install --no-audit --no-fund

      - name: Strict typecheck (pure domain modules)
        run: npm run typecheck

      - name: Ban explicit `any`
        run: npm run lint:noany

      - name: Hermetic unit suite (no docker / no network)
        run: npm run test:unit

  integration:
    name: Greenfield integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      # ubuntu-latest ships Docker + compose; the Greenfield mock-SP
      # stack comes up in-job. Covers serving, saving, access/retrieval,
      # encrypted-course indexing + decrypt round-trip, negatives, bench.
      - name: Greenfield network integration
        run: npm run test:integration

  contracts:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: smartcontracts/contracts
        # --no-git: vendor into lib/ without a submodule (mirrors the
        # contracts docker-compose); avoids dirty-tree/commit failures in CI.
        run: forge install --no-git foundry-rs/forge-std

      - name: forge build
        working-directory: smartcontracts/contracts
        run: forge build --sizes

      - name: forge test
        working-directory: smartcontracts/contracts
        run: forge test -vvv

      # ── Static analysis / coverage / gas (audit growth #1) ───────────
      # Advisory on introduction (forge fmt + slither need a triage pass
      # in a Foundry env first); flip continue-on-error → false once the
      # baseline is clean. forge coverage/snapshot are informational.
      - name: forge fmt --check
        working-directory: smartcontracts/contracts
        continue-on-error: true
        run: forge fmt --check

      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: smartcontracts/contracts
          slither-args: --exclude-dependencies

      - name: forge coverage (summary)
        working-directory: smartcontracts/contracts
        continue-on-error: true
        run: forge coverage --report summary

      - name: forge gas snapshot
        working-directory: smartcontracts/contracts
        continue-on-error: true
        run: forge snapshot && cat .gas-snapshot

