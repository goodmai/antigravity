# Runs the vitest suite + strict typecheck on every push / PR.
# (Deploy is handled separately by static.yml.)
name: Test & Typecheck

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json is gitignored in this repo, so use install (not ci).
      - run: npm install --no-audit --no-fund

      - name: Strict typecheck (pure domain modules)
        run: npm run typecheck

      - name: Ban explicit `any`
        run: npm run lint:noany

      - name: Hermetic unit suite (no docker / no network)
        run: npm run test:unit

  integration:
    name: Greenfield integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      # ubuntu-latest ships Docker + compose; the Greenfield mock-SP
      # stack comes up in-job. Covers serving, saving, access/retrieval,
      # encrypted-course indexing + decrypt round-trip, negatives, bench.
      - name: Greenfield network integration
        run: npm run test:integration

  contracts:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: smartcontracts/contracts
        # --no-git: vendor into lib/ without a submodule (mirrors the
        # contracts docker-compose); avoids dirty-tree/commit failures in CI.
        run: forge install --no-git foundry-rs/forge-std

      - name: forge build
        working-directory: smartcontracts/contracts
        run: forge build --sizes

      # Maximum verbosity (-vvvv) prints full call traces + emitted
      # logs/console2.log + reverts; --gas-report appends a per-contract
      # / per-function gas-usage table at the end of the run.
      - name: forge test (verbose + gas report)
        working-directory: smartcontracts/contracts
        run: forge test -vvvv --gas-report | tee forge-test.log

      - name: Upload forge-test log + gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-test-log
          path: smartcontracts/contracts/forge-test.log
          if-no-files-found: warn

      # ── Coverage gate (must be 100% over src/) ───────────────────────
      - name: forge coverage (summary + lcov)
        working-directory: smartcontracts/contracts
        run: |
          forge coverage --report summary | tee coverage-summary.txt
          forge coverage --report lcov

      - name: Enforce 100% src/ line coverage
        working-directory: smartcontracts/contracts
        run: bash scripts/check-coverage.sh lcov.info

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-coverage
          path: |
            smartcontracts/contracts/coverage-summary.txt
            smartcontracts/contracts/lcov.info
          if-no-files-found: warn

      # ── Advisory (flip to blocking after first triage in Foundry env) ─
      - name: forge fmt --check
        working-directory: smartcontracts/contracts
        continue-on-error: true
        run: forge fmt --check

      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: smartcontracts/contracts
          slither-args: --exclude-dependencies

      - name: forge gas snapshot
        working-directory: smartcontracts/contracts
        continue-on-error: true
        run: forge snapshot && cat .gas-snapshot

