# Runs the vitest suite + strict typecheck on every push / PR.
# (Deploy is handled separately by static.yml.)
name: Test & Typecheck

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json is gitignored in this repo, so use install (not ci).
      - run: npm install --no-audit --no-fund

      - name: Strict typecheck (pure domain modules)
        run: npm run typecheck

      - name: Ban explicit `any`
        run: npm run lint:noany

      - name: Hermetic unit suite (no docker / no network)
        run: npm run test:unit

  integration:
    name: Greenfield integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      # ubuntu-latest ships Docker + compose; the Greenfield mock-SP
      # stack comes up in-job. Covers serving, saving, access/retrieval,
      # encrypted-course indexing + decrypt round-trip, negatives, bench.
      - name: Greenfield network integration
        run: npm run test:integration

  chipotle-mock:
    name: Chipotle DRM integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      # The test-devnet profile wires chipotle-mock + frontend + a vitest
      # runner container that exercises the DRM encrypt/decrypt flow via
      # Docker service DNS. No funded testnet keys required — only the
      # local chipotle-mock is used.
      - name: Chipotle DRM integration (test-devnet profile)
        run: |
          docker compose -f smartcontracts/docker-compose.yml \
            --profile test-devnet up \
            --abort-on-container-exit \
            --exit-code-from test-devnet-runner

      - name: Teardown
        if: always()
        run: |
          docker compose -f smartcontracts/docker-compose.yml \
            --profile test-devnet down --remove-orphans

  contracts:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: smartcontracts/contracts
        # --no-git: vendor into lib/ without a submodule (mirrors the
        # contracts docker-compose); avoids dirty-tree/commit failures in CI.
        run: forge install --no-git foundry-rs/forge-std

      - name: forge build
        working-directory: smartcontracts/contracts
        run: forge build --sizes

      # Maximum verbosity (-vvvv) prints full call traces + emitted
      # logs/console2.log + reverts; --gas-report appends a per-contract
      # / per-function gas-usage table at the end of the run.
      - name: forge test (verbose + gas report)
        working-directory: smartcontracts/contracts
        run: forge test -vvvv --gas-report | tee forge-test.log

      - name: Upload forge-test log + gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-test-log
          path: smartcontracts/contracts/forge-test.log
          if-no-files-found: warn

      # ── Coverage gate (must be 100% over src/) ───────────────────────
      - name: forge coverage (summary + lcov)
        working-directory: smartcontracts/contracts
        run: |
          forge coverage --report summary | tee coverage-summary.txt
          forge coverage --report lcov

      - name: Enforce 100% src/ line coverage
        working-directory: smartcontracts/contracts
        run: bash scripts/check-coverage.sh lcov.info

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-coverage
          path: |
            smartcontracts/contracts/coverage-summary.txt
            smartcontracts/contracts/lcov.info
          if-no-files-found: warn

      # ── Advisory (flip to blocking after first triage in Foundry env) ─
      - name: forge fmt --check
        working-directory: smartcontracts/contracts
        continue-on-error: true
        run: forge fmt --check

      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: smartcontracts/contracts
          slither-args: --exclude-dependencies

      - name: forge gas snapshot
        working-directory: smartcontracts/contracts
        continue-on-error: true
        run: forge snapshot && cat .gas-snapshot

  chipotle-real-integration:
    name: Real Chipotle TEE Integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Chipotle Repo
        uses: actions/checkout@v4
        with:
          repository: LIT-Protocol/chipotle
          path: GitHub/chipotle
          ref: next

      - name: Checkout dstack Repo
        uses: actions/checkout@v4
        with:
          repository: Dstack-TEE/dstack
          path: GitHub/dstack

      - name: Setup Rust toolchain (for simulator build)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build dstack simulator
        working-directory: GitHub/dstack/sdk/simulator
        run: |
          cargo build --release -p dstack-guest-agent-simulator
          cp ../../target/release/dstack-simulator .

      - name: Setup Node.js (for deployer dependency install)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & Launch Real Chipotle Stack
        env:
          CHIPOTLE_DIR: ${{ github.workspace }}/GitHub/chipotle
          SIMULATOR_DIR: ${{ github.workspace }}/GitHub/dstack/sdk/simulator
        run: |
          docker compose -f smartcontracts/docker-compose.yml \
            --profile local-real-chipotle up -d --wait

      - name: Healthcheck and Sanity verification
        run: |
          # Wait up to 10 seconds for service response
          for i in {1..10}; do
            if curl -sf http://localhost:8000/core/v1/version; then
              echo "Real Chipotle is healthy and responding!"
              exit 0
            fi
            echo "Waiting for Real Chipotle..."
            sleep 2
          done
          echo "ERROR: Real Chipotle failed to respond in time."
          docker compose -f smartcontracts/docker-compose.yml --profile local-real-chipotle logs
          exit 1

      - name: Teardown
        if: always()
        env:
          CHIPOTLE_DIR: ${{ github.workspace }}/GitHub/chipotle
          SIMULATOR_DIR: ${{ github.workspace }}/GitHub/dstack/sdk/simulator
        run: |
          docker compose -f smartcontracts/docker-compose.yml \
            --profile local-real-chipotle down --remove-orphans -v


