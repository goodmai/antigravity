# Runs the vitest suite + strict typecheck on every push / PR.
# (Deploy is handled separately by static.yml.)
name: Test & Typecheck

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'smartcontracts/**'
      - 'run_e2e_lit.sh'
      - '.github/workflows/test.yml'
  workflow_dispatch:
  schedule:
    # Nightly run picks up the heavy chipotle-real-integration job.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Strict Typecheck
        run: npm run typecheck

      - name: No-any check
        run: npm run lint:noany

  forge-test:
    name: Foundry Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge dependencies
        working-directory: smartcontracts/contracts
        run: |
          forge install --no-git foundry-rs/forge-std
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.6.1

      - name: Forge build
        working-directory: smartcontracts/contracts
        run: forge build

      - name: Forge test
        working-directory: smartcontracts/contracts
        run: forge test -vvv

      - name: Verify Gas Snapshot
        working-directory: smartcontracts/contracts
        run: forge snapshot --check

  chipotle-real-integration:
    name: Real Chipotle TEE Integration (docker)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Chipotle Repo
        uses: actions/checkout@v5
        with:
          repository: LIT-Protocol/chipotle
          path: GitHub/chipotle
          ref: next

      - name: Patch Chipotle Dockerfile to include git
        run: |
          sed -i 's/libclang-dev \\/libclang-dev \\\n    git \\/' GitHub/chipotle/Dockerfile
          mkdir -p GitHub/chipotle/lit-api-server/static

      - name: Checkout dstack Repo
        uses: actions/checkout@v5
        with:
          repository: Dstack-TEE/dstack
          path: GitHub/dstack

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            GitHub/chipotle -> target
            GitHub/dstack -> target

      - name: Build dstack simulator
        working-directory: GitHub/dstack/sdk/simulator
        run: |
          cargo build --release -p dstack-guest-agent-simulator
          cp ../../target/release/dstack-simulator .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build & Launch Real Chipotle Stack
        env:
          CHIPOTLE_DIR: ${{ github.workspace }}/GitHub/chipotle
          SIMULATOR_DIR: ${{ github.workspace }}/GitHub/dstack/sdk/simulator
        run: |
          docker compose -f smartcontracts/docker-compose.yml \
            --profile local-real-chipotle up -d --wait

      - name: Healthcheck and Sanity verification
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8000/core/v1/version; then
              echo "Real Chipotle is healthy and responding!"
              exit 0
            fi
            echo "Waiting for Real Chipotle..."
            sleep 2
          done
          echo "ERROR: Real Chipotle failed to respond in time."
          docker compose -f smartcontracts/docker-compose.yml --profile local-real-chipotle logs
          exit 1

      - name: Teardown
        if: always()
        env:
          CHIPOTLE_DIR: ${{ github.workspace }}/GitHub/chipotle
          SIMULATOR_DIR: ${{ github.workspace }}/GitHub/dstack/sdk/simulator
        run: |
          docker compose -f smartcontracts/docker-compose.yml \
            --profile local-real-chipotle down --remove-orphans -v

  e2e-lit-integration:
    name: E2E Lit Protocol Gating Integration
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Chipotle Repo
        uses: actions/checkout@v5
        with:
          repository: LIT-Protocol/chipotle
          path: GitHub/chipotle
          ref: next

      - name: Patch Chipotle Dockerfile to include git
        run: |
          sed -i 's/libclang-dev \\/libclang-dev \\\n    git \\/' GitHub/chipotle/Dockerfile
          mkdir -p GitHub/chipotle/lit-api-server/static

      - name: Checkout dstack Repo
        uses: actions/checkout@v5
        with:
          repository: Dstack-TEE/dstack
          path: GitHub/dstack

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            GitHub/chipotle -> target
            GitHub/dstack -> target

      - name: Build dstack simulator
        working-directory: GitHub/dstack/sdk/simulator
        run: |
          cargo build --release -p dstack-guest-agent-simulator
          cp ../../target/release/dstack-simulator .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run E2E Lit Integration Tests
        env:
          CHIPOTLE_DIR: ${{ github.workspace }}/GitHub/chipotle
          SIMULATOR_DIR: ${{ github.workspace }}/GitHub/dstack/sdk/simulator
        run: |
          chmod +x run_e2e_lit.sh
          ./run_e2e_lit.sh

      - name: Teardown
        if: always()
        env:
          CHIPOTLE_DIR: ${{ github.workspace }}/GitHub/chipotle
          SIMULATOR_DIR: ${{ github.workspace }}/GitHub/dstack/sdk/simulator
        run: |
          docker compose -f smartcontracts/docker-compose.lit.yml down --remove-orphans -v

  integration-test:
    name: Integration (Docker) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Integration Tests
        run: npm run test:integration

  devnet-e2e:
    name: Devnet E2E (Flow C, Real networks)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Devnet E2E Tests
        env:
          GREENFIELD_TESTNET_PRIVATE_KEY: ${{ secrets.GREENFIELD_TESTNET_PRIVATE_KEY }}
          GREENFIELD_TESTNET_ADDRESS: ${{ secrets.GREENFIELD_TESTNET_ADDRESS }}
        run: |
          if [ -n "$GREENFIELD_TESTNET_PRIVATE_KEY" ]; then
            node smartcontracts/e2e/run-e2e.mjs
          else
            echo "⏭️ Skipping Devnet E2E tests: GREENFIELD_TESTNET_PRIVATE_KEY secret is not set."
          fi

  ui-e2e-synpress:
    name: Full UI E2E (Synpress + MetaMask, docker local-full)
    # Heavy headed-browser job: real MetaMask 13.24.0 driven over CDP against the
    # full local stack. Runs on PRs touching smartcontracts/**, nightly, and on demand.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: smartcontracts/e2e-synpress
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # The deploy container mounts ./contracts and runs `forge build`; it
      # auto-installs forge-std but expects openzeppelin-contracts to already be
      # in lib/ (both are gitignored). Populate lib/ on the runner first.
      - name: Install forge dependencies
        working-directory: smartcontracts/contracts
        run: |
          forge install --no-git foundry-rs/forge-std
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.6.1

      # ── Local stack: Anvil (31337) + deterministic deploy + frontend (8085) + chipotle-mock (8000) ──
      - name: Bring up local-full stack
        working-directory: smartcontracts
        run: |
          docker compose -f docker-compose.yml --profile local-full up -d \
            anvil frontend chipotle-mock deploy
          echo "Waiting for one-shot deploy to finish…"
          code="$(docker wait daskibo-deploy)"
          docker logs daskibo-deploy | tail -25
          [ "$code" = "0" ] || { echo "::error::contract deploy failed (exit $code)"; exit 1; }

      - name: Wait for endpoints (Anvil / frontend / chipotle-mock)
        working-directory: smartcontracts
        run: |
          ok() { curl -sf -m 4 "$@" >/dev/null; }
          for i in $(seq 1 30); do
            if ok -X POST http://localhost:9545 -H 'content-type: application/json' \
                  --data '{"jsonrpc":"2.0","method":"eth_chainId","id":1}' \
               && ok http://localhost:8085/course-demo.html \
               && ok http://localhost:8000/core/v1/version; then
              echo "All endpoints healthy."; exit 0
            fi
            echo "waiting for stack… ($i)"; sleep 2
          done
          echo "::error::stack did not become healthy"; docker compose -f docker-compose.yml ps; exit 1

      # ── Headed-browser prerequisites (not committed — fetched fresh) ──
      - name: Install MetaMask 13.24.0 extension
        run: |
          curl -fsSL -o /tmp/mm.zip \
            https://github.com/MetaMask/metamask-extension/releases/download/v13.24.0/metamask-chrome-13.24.0.zip
          mkdir -p /tmp/metamask-13.24.0
          unzip -q /tmp/mm.zip -d /tmp/metamask-13.24.0
          test -f /tmp/metamask-13.24.0/manifest.json
          echo "METAMASK_EXT_PATH=/tmp/metamask-13.24.0" >> "$GITHUB_ENV"

      - name: Install Chrome-for-Testing 130 (honours --load-extension; Chrome 137+ blocks it)
        run: |
          npx -y @puppeteer/browsers install chrome@130 --path "$HOME/cft" | tee /tmp/cft.txt
          CHROME_BIN="$(awk 'END{print $NF}' /tmp/cft.txt)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install e2e deps + browser libs + apply MetaMask 13.24.0 patches
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install-deps chromium
          node patch-synpress.mjs

      # ── Build the Synpress wallet cache fresh (it is keyed to the extension id,
      #    so it must be rebuilt in CI rather than shipped) and run the suite. ──
      - name: Build Synpress wallet cache (headed under Xvfb)
        run: xvfb-run -a node build-cache.mjs --force

      - name: Run full UI E2E suite
        run: xvfb-run -a npx playwright test --reporter=line --timeout=70000 --global-timeout=900000

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synpress-ui-report
          path: |
            smartcontracts/e2e-synpress/playwright-report/
            smartcontracts/e2e-synpress/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        working-directory: smartcontracts
        run: docker compose -f docker-compose.yml --profile local-full logs --tail=120

      - name: Teardown
        if: always()
        working-directory: smartcontracts
        run: docker compose -f docker-compose.yml --profile local-full down --remove-orphans -v
